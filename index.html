<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Xulo, llc – Official Site</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b0b;
      color: #f5f5f5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header img {
      width: 100%;
      max-width: 900px;
      border-radius: 6px;
      display: block;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 16px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .section {
      background: #141414;
      padding: 24px;
      border-radius: 10px;
      margin-bottom: 40px;
      box-shadow: 0 0 20px rgba(0,0,0,0.35);
      text-align: center;
    }

    .section img {
      width: 100%;
      max-width: 850px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .section p {
      margin: 0 auto;
      max-width: 750px;
      line-height: 1.7;
      font-size: 1rem;
    }

    .store-link {
      display: block;
      margin: 10px auto;
      text-decoration: none;
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.9rem;
      padding: 10px 0;
      transition: 0.2s ease;
    }

    .store-link:hover {
      color: #ff4f4f;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Banner -->
    <header>
      <img src="banner.png" alt="ANIMA banner" />
    </header>

    <h2>About Xulo, LLC</h2>

    <!-- ANIMA description section -->
    <section class="section" id="about-anima">
      <img src="desc.png" alt="ANIMA world illustration" />
      <!-- Replace this with your description text -->
    </section>

    <!-- Comic store section -->
    <section class="section" id="store">
      <h2>Products:</h2>


      <a class="store-link" href="https://open.spotify.com/artist/0A2l1p5kMMkItKlFuvuAnk?si=1oBjA5FfRLGKie_FxUhrtg">
        <img src="gb.png"/>
        🔗 Xulo Music
      </a>

      <a class="store-link" href="kindesc.netlify.app">
        <img src="kindesc.png"/>
        🔗 New Metaverse, kin coming soon!
      </a>

		<p>contact: xulo.xo.llc@gmail.com</p>

    </section>

  </div>
</body>
</html>
